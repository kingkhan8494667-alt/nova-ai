<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#080d1b;
color:white;
text-align:center;
}
header{
padding:25px;
font-size:30px;
font-weight:bold;
color:#8c9eff;
}
.hero{padding:65px 15px 35px}
h1{font-size:42px}
.hero p{color:#b5bfd8;font-size:17px}
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:15px;
padding:20px;
max-width:850px;
margin:auto;
}
.card{
background:#151e35;
padding:28px 10px;
border-radius:16px;
border:1px solid #293858;
font-size:18px;
}
.card span{font-size:35px;display:block;margin-bottom:12px}
footer{padding:30px;color:#9ca8c5}
</style>
</head>
<body>
<header>🌙 NOVA AI</header>
<section class="hero">
<h1>One Platform,<br>Endless Possibilities.</h1>
<p>Welcome to the Future of Artificial Intelligence.</p>
</section>
<div class="container">
<div class="card"><span>🤖</span>AI Chat</div>
<div class="card"><span>🎨</span>AI Images</div>
<div class="card"><span>🎬</span>AI Videos</div>
<div class="card"><span>📚</span>Stories</div>
<div class="card"><span>📝</span>Articles</div>
<div class="card"><span>🌍</span>AI Tools</div>
</div>
<footer>© 2026 NOVA AI | All Rights Reserved</footer>
</body>
</html>
